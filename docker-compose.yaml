services:
  python-img:
    build: .
    container_name: python-container
    # anonymous volume for app code
    # mount the current directory to /app in the container
    volumes:
      - ./:/app
    environment:
      - PORT=8000
    ports:
      - "8000:3000"
  
  mysql:
    image: mysql:latest
    container_name: mysql-container
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mydb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: